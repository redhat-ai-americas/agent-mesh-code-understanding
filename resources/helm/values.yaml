otel:
  createBucket: false
  tempo:
    bucket: tempo
    storageSize: 10Gi

console:
  enabled: true
  replicas: 1
  image: ""
  imagePullPolicy: Always
  downloadMaxBytes: 5368709120
  ephemeralStorage:
    request: 10Gi
    limit: 12Gi
