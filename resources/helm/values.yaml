deployNotebooks: false

repoUrl: ""
repoRef: main

minio:
  rootUser: ""
  rootPassword: ""
  bucket: demo
  region: us-east-1
  image: "quay.io/minio/minio:latest"
  mcImage: "quay.io/minio/mc:latest"

dataGeneration:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Data Generation"
    tag: latest
    digestRef: ""
  notebook:
    name: data-generation
    mlflowInstance: ""

graphrag:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - GraphRAG Indexing"
    tag: latest
    digestRef: ""
  notebook:
    name: graphrag-indexing
    mlflowInstance: ""

analysis:
  image:
    registry: ""
    name: ""
    title: "Agent Mesh - Analysis"
    tag: latest
  notebook:
    name: graphrag-analysis

pipelineTools:
  image:
    registry: ""
    name: pipeline-tools
    tag: latest

adhocQuery:
  run: false
  graphragDir: "graph_rag_app/source"
  useGlobal: "1"
