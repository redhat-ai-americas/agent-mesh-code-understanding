---
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-assets
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-upload-job
      containers:
        - name: upload-assets
          image: {{ .Values.pipelineTools.image.registry }}/{{ .Values.pipelineTools.image.name }}:{{ .Values.pipelineTools.image.tag }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              git config --global --add safe.directory /opt/app-root/src
              git init /opt/app-root/src
              git -C /opt/app-root/src remote add origin "{{ .Values.repoUrl }}" 2>/dev/null || true
              git -C /opt/app-root/src fetch --depth=1 origin "{{ .Values.repoRef }}"
              git -C /opt/app-root/src reset --hard FETCH_HEAD
              python - <<'PYEOF'
              import sys, os, mlflow
              code_dir = os.path.join(os.getcwd(), 'workflows', 'examples', 'code_understanding')
              sys.path.insert(0, code_dir)
              from loaders.mlflow_asset_loader import MlFlowAssetLoader

              os.environ.pop("MLFLOW_WORKSPACE", None)

              mlflow.set_tracking_uri(os.getenv("MLFLOW_TRACKING_URI", "https://mlflow.redhat-ods-applications.svc:8443"))

              MlFlowAssetLoader().upload_all_assets(os.path.join(code_dir, 'assets'))
              PYEOF
          workingDir: /opt/app-root/src
          env:
            - name: MLFLOW_TRACKING_INSECURE_TLS
              value: "true"
            - name: MLFLOW_WORKSPACE
              value: "{{ .Values.namespace }}"
            - name: AGENTMESH_REPO_URL
              value: "{{ .Values.repoUrl }}"
            - name: AGENTMESH_REPO_REF
              value: "{{ .Values.repoRef }}"
          envFrom:
            - secretRef:
                name: code-understanding-env
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          emptyDir: {}
