{{- if .Values.console.enabled }}
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: code-understanding-console
  namespace: {{ .Values.namespace }}
  labels:
    app: code-understanding-console
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: code-understanding-console
  namespace: {{ .Values.namespace }}
  labels:
    app: code-understanding-console
spec:
  output:
    to:
      kind: ImageStreamTag
      name: code-understanding-console:latest
  source:
    type: Binary
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  triggers: []
{{- end }}
