---
apiVersion: batch/v1
kind: Job
metadata:
  name: upload-kubeflow-pipelines
  namespace: {{ .Values.namespace }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-upload-job
      containers:
        - name: upload-pipelines
          image: {{ .Values.pipelineTools.image.registry }}/{{ .Values.pipelineTools.image.name }}:{{ .Values.pipelineTools.image.tag }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              git config --global --add safe.directory /opt/app-root/src
              git init /opt/app-root/src
              git -C /opt/app-root/src remote add origin "{{ .Values.repoUrl }}" 2>/dev/null || true
              git -C /opt/app-root/src fetch --depth=1 origin "{{ .Values.repoRef }}"
              git -C /opt/app-root/src reset --hard FETCH_HEAD
              workflows/examples/code_understanding/scripts/upload_pipelines.sh
          workingDir: /opt/app-root/src
          env:
            - name: KFP_HOST
              value: "https://ds-pipeline-dspa.{{ .Values.namespace }}.svc.cluster.local:8443"
            - name: KFP_NAMESPACE
              value: "{{ .Values.namespace }}"
            - name: MLFLOW_WORKSPACE
              value: "{{ .Values.namespace }}"
            - name: MLFLOW_TRACKING_INSECURE_TLS
              value: "true"
            - name: MLFLOW_TRACKING_AUTH
              value: "kubernetes-namespaced"
            - name: AGENTMESH_REPO_URL
              value: "{{ .Values.repoUrl }}"
            - name: AGENTMESH_REPO_REF
              value: "{{ .Values.repoRef }}"
          envFrom:
            - secretRef:
                name: code-understanding-env
                optional: true
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          emptyDir: {}
