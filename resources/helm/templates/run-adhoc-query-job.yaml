{{- if .Values.adhocQuery.run }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: run-adhoc-query-{{ .Values.adhocQuery.jobId }}
  namespace: {{ .Values.namespace }}
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: pipeline-upload-job
      containers:
        - name: adhoc-query
          image: {{ .Values.analysis.image.registry }}/{{ .Values.analysis.image.name }}:{{ .Values.analysis.image.tag }}
          command:
            - sh
            - -c
            - |
              set -euo pipefail
              git config --global credential.helper '!f() { echo "username=${GIT_USERNAME}"; echo "password=${GIT_TOKEN}"; }; f'
              git config --global --add safe.directory /opt/app-root/src
              git init /opt/app-root/src
              git -C /opt/app-root/src remote add origin "{{ .Values.repoUrl }}" 2>/dev/null || true
              git -C /opt/app-root/src fetch --depth=1 origin "{{ .Values.repoRef }}"
              git -C /opt/app-root/src reset --hard FETCH_HEAD
              workflows/examples/code_understanding/scripts/run_adhoc_query.sh
          workingDir: /opt/app-root/src
          env:
            - name: QUESTION
              valueFrom:
                configMapKeyRef:
                  name: adhoc-query-{{ .Values.adhocQuery.jobId }}
                  key: question
            - name: USE_GLOBAL
              value: "{{ .Values.adhocQuery.useGlobal }}"
            - name: RETRY_COUNT
              value: "{{ .Values.adhocQuery.retryCount }}"
            - name: GIT_REPO
              value: "{{ .Values.adhocQuery.gitRepo }}"
            - name: GIT_BRANCH
              value: "{{ .Values.adhocQuery.gitBranch }}"
            - name: GRAPHRAG_LOCAL_QUERY_SKIP_TLS_VERIFY
              value: "true"
            - name: AGENTMESH_REPO_URL
              value: "{{ .Values.repoUrl }}"
            - name: AGENTMESH_REPO_REF
              value: "{{ .Values.repoRef }}"
          envFrom:
            - secretRef:
                name: code-understanding-env
                optional: true
          volumeMounts:
            - name: workspace
              mountPath: /opt/app-root/src
      volumes:
        - name: workspace
          emptyDir: {}
{{- end }}
