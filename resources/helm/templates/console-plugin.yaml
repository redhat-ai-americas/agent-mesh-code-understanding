{{- if .Values.consolePlugin.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: code-understanding-console-plugin-config
  namespace: {{ .Values.namespace }}
  labels:
    app: code-understanding-console-plugin
data:
  config.json: |
    {
      "appUrl": "https://{{ include "codeUnderstanding.pluginApiRouteHost" . }}"
    }
  nginx.conf: |
    worker_processes auto;
    error_log /dev/stderr notice;
    pid /tmp/nginx.pid;

    events {
      worker_connections 1024;
    }

    http {
      include /etc/nginx/mime.types;
      default_type application/octet-stream;
      access_log /dev/stdout;
      sendfile on;
      keepalive_timeout 65;

      server {
        listen 9443 ssl;
        server_name _;
        root /usr/share/nginx/html;

        ssl_certificate /var/serving-cert/tls.crt;
        ssl_certificate_key /var/serving-cert/tls.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
          try_files $uri $uri/ /index.html;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: code-understanding-console-plugin
  namespace: {{ .Values.namespace }}
  labels:
    app: code-understanding-console-plugin
spec:
  replicas: {{ .Values.consolePlugin.replicas }}
  selector:
    matchLabels:
      app: code-understanding-console-plugin
  template:
    metadata:
      labels:
        app: code-understanding-console-plugin
    spec:
      containers:
        - name: plugin
          image: "{{ if .Values.consolePlugin.image }}{{ .Values.consolePlugin.image }}{{ else }}image-registry.openshift-image-registry.svc:5000/{{ .Values.namespace }}/code-understanding-console-plugin:latest{{ end }}"
          imagePullPolicy: {{ .Values.consolePlugin.imagePullPolicy }}
          ports:
            - name: https
              containerPort: 9443
          volumeMounts:
            - name: plugin-config
              mountPath: /usr/share/nginx/html/config.json
              subPath: config.json
            - name: serving-cert
              mountPath: /var/serving-cert
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: https
              scheme: HTTPS
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /plugin-manifest.json
              port: https
              scheme: HTTPS
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: plugin-config
          configMap:
            name: code-understanding-console-plugin-config
        - name: nginx-config
          configMap:
            name: code-understanding-console-plugin-config
        - name: serving-cert
          secret:
            secretName: code-understanding-console-plugin-cert
---
apiVersion: v1
kind: Service
metadata:
  name: code-understanding-console-plugin
  namespace: {{ .Values.namespace }}
  labels:
    app: code-understanding-console-plugin
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: code-understanding-console-plugin-cert
spec:
  selector:
    app: code-understanding-console-plugin
  ports:
    - name: https
      port: 9443
      targetPort: https
---
apiVersion: console.openshift.io/v1
kind: ConsolePlugin
metadata:
  name: code-understanding-console
  labels:
    app: code-understanding-console-plugin
spec:
  displayName: Code Understanding
  backend:
    type: Service
    service:
      name: code-understanding-console-plugin
      namespace: {{ .Values.namespace }}
      port: 9443
      basePath: /
  proxy:
    - alias: backend
      authorization: None
      endpoint:
        type: Service
        service:
          name: code-understanding-plugin-api
          namespace: {{ .Values.namespace }}
          port: 8443
  i18n:
    loadType: Preload
---
apiVersion: console.openshift.io/v1
kind: ConsoleLink
metadata:
  name: code-understanding-console
  labels:
    app: code-understanding-console-plugin
spec:
  location: ApplicationMenu
  text: Code Understanding
  href: {{ include "codeUnderstanding.consolePluginHref" . }}
  applicationMenu:
    section: {{ .Values.consolePlugin.applicationMenuSection }}
    imageURL: {{ .Values.consolePlugin.iconDataUri }}
{{- end }}
